<style>
:root{--bg:#EEF0F7;--card:#FFFFFF;--ink:#151A2B;--mute:#6A7188;--line:#DDE1EC;--acc:#3B5BFF;--onacc:#fff;--ok:#1E9E68;--warn:#D1491A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1B2027;--ink:#EEF0F3;--mute:#9AA3AE;--line:#2E353E;--acc:#5B7BFF;--onacc:#0B0E14;--ok:#4CC38A;--warn:#F59E5B}}
:root[data-theme="dark"]{--bg:#111418;--card:#1B2027;--ink:#EEF0F3;--mute:#9AA3AE;--line:#2E353E;--acc:#5B7BFF;--onacc:#0B0E14;--ok:#4CC38A;--warn:#F59E5B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1,h2,.big{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
h1{font-size:32px;line-height:1.05;text-transform:capitalize}h2{font-size:24px}
.mute{color:var(--mute)}
nav{display:flex;gap:8px;margin-bottom:16px}nav button{flex:1;padding:12px 6px}
button{font:600 16px Barlow,system-ui,sans-serif;border-radius:12px;padding:14px 16px;background:var(--card);color:var(--ink);border:1px solid var(--line);cursor:pointer}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.go{width:100%;font-size:22px;padding:22px;font-family:"Barlow Condensed",sans-serif;font-weight:700}
button.sm{padding:8px 12px;font-size:14px}
button.del{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ex{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:0}
.ex b{font-size:18px;display:block}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{width:18px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ok)}
.tick{color:var(--ok);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .big{font-size:34px}
.hero{text-align:center;padding:10px 0 18px}.hero .big{font-size:96px;line-height:1}.hero .lbl{font-size:18px}
.step{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 20px}
.step button{width:52px;height:52px;padding:0;font-size:26px}.step .big{font-size:48px;min-width:130px;text-align:center}
.rest .big{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
label{font-size:13px;color:var(--mute);display:block}
input,select{width:100%;font:500 16px Barlow,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.stat b{font-size:20px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wh{text-align:center;font-size:12px;color:var(--mute)}
.cc{padding:6px 2px;min-height:60px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
.cc small{font-size:10px;line-height:1.1;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc.sl{outline:2px solid var(--ink)}.cc.td{border:2px solid var(--acc)}
.dot{width:8px;height:8px;border-radius:50%}.dot.p{background:var(--acc)}.dot.d{background:var(--ok)}.dot.r{background:var(--mute)}
.wr{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:6px}
.wr.sl{outline:2px solid var(--ink)}.wr.td{border:2px solid var(--acc)}
body{background:radial-gradient(900px 420px at 50% -140px,color-mix(in srgb,var(--acc) 16%,transparent),transparent),var(--bg);background-attachment:fixed}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(20,26,50,.05),0 8px 20px -10px rgba(20,26,50,.16)}
button{transition:transform .12s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease}
button:active:not(:disabled){transform:scale(.97)}
button:hover:not(:disabled){border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
button.pri{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 62%,#8B5CF6));border-color:transparent;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--acc) 75%,transparent)}
button.go{border-radius:16px}
nav button.sel{background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.dots i{transition:background .3s ease}
.dots i.on{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 55%,#22D3EE))}
.hero .big,.bar .big,.step .big{font-variant-numeric:tabular-nums}
.rest .big{text-shadow:0 0 30px color-mix(in srgb,var(--acc) 38%,transparent)}
.tick{letter-spacing:.01em}
.bar{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.cc.td,.wr.td{background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.dot.d{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.p{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
input,select{transition:border-color .2s ease,box-shadow .2s ease}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Pulido visual ---- */
body{-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
main{padding-bottom:150px}
nav{display:none}
h1{font-size:30px;text-transform:none;letter-spacing:-.005em}
h1::first-letter,.cap::first-letter{text-transform:uppercase}
.cap{display:inline-block}
label{text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:600;margin-bottom:4px}
.card{border:1px solid color-mix(in srgb,var(--line) 75%,transparent);box-shadow:0 1px 1px rgba(16,24,48,.04),0 14px 30px -18px rgba(16,24,48,.28)}
input,select{border-radius:12px;padding:11px 12px}
.exl{display:flex;align-items:center;gap:12px;min-width:0}
.ix{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:700 17px "Barlow Condensed",sans-serif;background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--acc)}
.ix.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chev{font-size:26px;line-height:1;color:var(--mute)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs div{max-width:520px;margin:0 auto;display:flex;gap:4px}
#tabs button{flex:1;background:none;border:0;box-shadow:none;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute)}
#tabs button.on{color:var(--acc)}
#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.tabs .bar{bottom:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:12px;border-top:0;border-bottom:1px solid var(--line)}
.seg{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;box-shadow:none;padding:9px;border-radius:9px;color:var(--mute)}
.seg button.sel{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,48,.16)}
.ring{position:relative;width:230px;height:230px;margin:6px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .rt{stroke:var(--line)}
.ring .rf{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:565.5;transition:stroke-dashoffset .5s linear}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc .big{font-size:64px;line-height:1}
.step button{border-radius:50%}
button.go{letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tiles div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 10px 24px -18px rgba(16,24,48,.3)}
.tiles b{display:block;font:700 30px/1.1 "Barlow Condensed",sans-serif}
.tiles span{font-size:12px;color:var(--mute)}
.fin .big{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#8B5CF6));-webkit-background-clip:text;background-clip:text;color:transparent}
.pc{width:100%;height:auto;display:block}
.pc .gl{stroke:var(--line);stroke-width:1}
.pc .pl{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.pc .pd{fill:var(--card);stroke:var(--acc);stroke-width:2}
.pc text{font:11px Barlow,system-ui,sans-serif;fill:var(--mute)}
.pc .pv{fill:var(--ink);font-weight:600}
.prow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{margin-top:8px}
.up{color:var(--ok)}.dn{color:var(--warn)}
.blk{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 2px}
.card.bk{border-left:4px solid var(--acc)}
.blkbox{border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card));border-radius:14px;padding:12px;margin-top:12px}
.blkh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.exr{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.blkbox .exr{border-top:0;margin-top:0;padding-top:0}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.lnk{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;margin:10px auto;background:var(--acc);color:var(--onacc);font-weight:700;font-size:15px;line-height:1}
.sec{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.card.dn{opacity:.7}
.card.live{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.lvh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lv{font-size:46px;line-height:1;color:var(--acc)}
.pz{text-align:center;font-weight:600;color:var(--warn);margin:6px 0 0}
.prog{display:flex;align-items:center;gap:12px;margin:6px 0 12px;font-weight:600}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#8B5CF6));transition:width .4s ease}
</style>
</head>
<body>
<main id="app"></main>
<script>
var S={tpls:[],plan:{},hist:[],session:null};
var view="hoy",vd="",curEx=null,summary=null,audio=null,sel="",cal={m:"sem",ref:""};
function p2(n){return String(n).padStart(2,"0")}
function dk(d){d=d||new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function pd(k){var a=k.split("-");return new Date(+a[0],a[1]-1,+a[2])}
function addD(k,n){var d=pd(k);d.setDate(d.getDate()+n);return dk(d)}
function mon(k){return addD(k,-((pd(k).getDay()+6)%7))}
function lt(k,o){return pd(k).toLocaleDateString("es-AR",o)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;return(h?h+":"+p2(m):m)+":"+p2(s)}
function tpl(id){return S.tpls.filter(function(t){return t.id===id})[0]}
function load(){
 try{var d=JSON.parse(localStorage.getItem("rutina-gym"));if(d)S=d}catch(e){}
 if(S.days){S.tpls=S.days.filter(function(d){return!d.rest}).map(function(d){return{id:d.id,name:d.name,ex:d.ex}});delete S.days;delete S.pos}
 S.tpls=S.tpls||[];S.plan=S.plan||{};S.hist=S.hist||[];
 S.hist.forEach(function(h){if(typeof h.date==="number")h.date=dk(new Date(h.date))});
 if(S.session&&!S.session.date)S.session.date=dk();
 if(!S.tpls.length&&!S.hist.length)S.tpls=[{id:uid(),name:"Día 1",ex:[
  {id:uid(),name:"Press banca",sets:4,reps:10,kg:40,rest:90},
  {id:uid(),name:"Press inclinado con mancuernas",sets:3,reps:12,kg:16,rest:75},
  {id:uid(),name:"Fondos en banco",sets:3,reps:12,kg:0,rest:60}]}];
 S.tpls.forEach(function(x){grp(x).forEach(function(g){if(g.length>1){var n=Math.max.apply(null,g.map(function(q){return q.sets}));g.forEach(function(q){q.sets=n})}})});
 vd=dk();sel=vd;cal.ref=vd}
function save(){try{localStorage.setItem("rutina-gym",JSON.stringify(S))}catch(e){}}
function au(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}catch(e){}return audio}
function tone(f,d,v){try{var a=au(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type="sine";o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.35,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.03)}catch(e){}}
function beepShort(){tone(880,.16);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function beepLong(){tone(1320,.8,.45);try{navigator.vibrate&&navigator.vibrate(420)}catch(e){}}
var wl=null;
function keepOn(on){try{if(on){if(navigator.wakeLock&&!wl)navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null})}).catch(function(){})}else if(wl){wl.release();wl=null}}catch(e){}}
try{document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.session&&S.session.start)keepOn(true)})}catch(e){}

function go(v){view=v;render()}
function tab(v){if(v==="hoy"&&!S.session)vd=dk();go(v)}

function render(){
 var a=document.getElementById("app"),on=view==="cal"?"cal":view==="rut"?"rut":view==="pro"?"pro":"hoy";
 var nav='<nav>'+[["hoy","Hoy"],["cal","Calendario"],["pro","Progreso"],["rut","Rutinas"]].map(function(x){return'<button class="'+(on===x[0]?"sel":"")+'" onclick="tab(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</nav>';
 if(view==="ex")a.innerHTML=exView();
 else if(view==="fin")a.innerHTML=finView();
 else a.innerHTML=nav+(view==="cal"?calView():view==="pro"?progView():view==="rut"?editor():hoy());
 var tb=document.getElementById("tabs");if(!tb){tb=document.createElement("div");tb.id="tabs";document.body.appendChild(tb)}
 var show=view!=="ex"&&view!=="fin";tb.style.display=show?"":"none";document.body.classList.toggle("tabs",show);
 var IC={hoy:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',pro:'<path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 7"/>',rut:'<path d="M8.5 6.5H20M8.5 12H20M8.5 17.5H20M4 6.5h.01M4 12h.01M4 17.5h.01"/>'};
 if(show)tb.innerHTML='<div>'+[["hoy","Hoy"],["cal","Calendario"],["pro","Progreso"],["rut","Rutinas"]].map(function(x){return'<button class="'+(on===x[0]?"on":"")+'" onclick="tab(\''+x[0]+'\')"><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[x[0]]+'</svg>'+x[1]+'</button>'}).join("")+'</div>';
 tick()}

function ctxTpl(){var s=S.session;if(s)return tpl(s.dayId);var a=S.plan[vd];return a&&a!=="rest"?tpl(a):null}
function hoy(){
 var s=S.session,k=s?s.date:vd,a=S.plan[k],t=ctxTpl();
 var h=k!==dk()?'<button class="sm" style="margin-bottom:10px" onclick="vd=dk();render()">‹ Volver a hoy</button>':"";
 h+='<h1>'+lt(k,{weekday:"long",day:"numeric",month:"long"})+'</h1>';
 if(!s&&a==="rest")return h+'<div class="card" style="text-align:center;padding:30px 14px;margin-top:12px"><p class="big" style="font-size:44px;margin:0 0 6px">Día de descanso</p><p class="mute" style="margin:0">Hoy no entrenás. Recuperá bien.</p></div>';
 if(!t){
  h+='<p class="mute">No hay ningún entrenamiento asignado a este día.</p>';
  if(!S.tpls.length)return h+'<p class="mute">Primero cargá tus días en Rutinas.</p>';
  return h+'<p class="mute">Elegí uno para hacerlo ahora:</p>'+S.tpls.map(function(x){return'<button class="go" style="margin-bottom:8px;font-size:20px" onclick="setPlan(\''+k+'\',\''+x.id+'\')">'+esc(x.name)+'</button>'}).join("")}
 h+='<h2 style="margin:12px 0 10px">'+esc(t.name)+'</h2>';
 var dn=S.hist.filter(function(x){return x.date===k});
 if(!s&&dn.length)h+='<div class="card"><span class="tick">Completado</span> · '+fmt(dn[dn.length-1].dur)+' de entrenamiento</div>';
 if(!t.ex.length)h+='<p class="mute">Este día no tiene ejercicios. Agregalos en Rutinas.</p>';
 var nd=0,tot=grp(t).length,pendH="",doneH="",allH="";
 grp(t).forEach(function(g,gi){
  function dt(x){var n=s&&s.sets[x.id]||0,d="";for(var i=0;i<x.sets;i++)d+='<i class="'+(i<n?"on":"")+'"></i>';return d}
  function sub(x){return x.sets+' × '+x.reps+(x.kg?' · '+x.kg+' kg':' · peso corporal')}
  function sub2(x){return x.reps+' reps'+(x.kg?' · '+x.kg+' kg':' · peso corporal')+(x.rest?' · desc. '+x.rest+' s':' · sin descanso')}
  var all=g.every(function(x){return(s&&s.sets[x.id]||0)>=x.sets}),tg=(s&&due(g,s))||g[0],end=all?'<span class="pill">Hecho</span>':'<span class="chev">›</span>',c;
  if(g.length===1){var e=g[0];
   c='<div class="card'+(all&&s&&s.start?" dn":"")+'"><button class="ex" onclick="openEx(\''+e.id+'\')"><span class="exl"><span class="ix'+(all?" ok":"")+'">'+(gi+1)+'</span><span><b>'+esc(e.name)+'</b><span class="mute">'+sub(e)+'</span><span class="dots">'+dt(e)+'</span></span></span>'+end+'</button></div>'}

/* ---------- Progreso ---------- */
var pr={ex:"",m:"peso"};
var MU={peso:["Peso máx.","kg"],reps:["Reps por serie",""],series:["Series",""],vol:["Volumen","kg"]};
function nf(x){return(Math.round(x*10)/10).toLocaleString("es-AR")}
function exNames(){var seen={},out=[];for(var i=S.hist.length-1;i>=0;i--){(S.hist[i].log||[]).forEach(function(l){if(!seen[l.n]){seen[l.n]=1;out.push(l.n)}})}return out}
function sess(name){var r=[];S.hist.forEach(function(h){var e=(h.log||[]).filter(function(l){return l.n===name});if(!e.length)return;
 r.push({date:h.date,e:e,kg:Math.max.apply(null,e.map(function(l){return l.kg})),n:e.length,reps:e.reduce(function(a,l){return a+l.r},0)/e.length,vol:e.reduce(function(a,l){return a+l.kg*l.r},0)})});
 r.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});return r}
function pv(s,m){return m==="peso"?s.kg:m==="reps"?s.reps:m==="series"?s.n:s.vol}
function chart(v,ds){
 var W=320,H=160,L=14,R=14,T=22,B=26,lo=Math.min.apply(null,v),hi=Math.max.apply(null,v);
 if(hi===lo){lo-=1;hi+=1}else{var p=(hi-lo)*.2;lo-=p;hi+=p}
 var X=function(i){return v.length>1?L+i*(W-L-R)/(v.length-1):W/2},Y=function(x){return T+(1-(x-lo)/(hi-lo))*(H-T-B)};
 var pts=v.map(function(x,i){return X(i).toFixed(1)+","+Y(x).toFixed(1)}),mx=v.indexOf(Math.max.apply(null,v));
 var s='<svg class="pc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>';
 [T,(T+H-B)/2,H-B].forEach(function(y){s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>'});
 if(v.length>1)s+='<path d="M'+X(0).toFixed(1)+","+(H-B)+" L"+pts.join(" L")+" L"+X(v.length-1).toFixed(1)+","+(H-B)+'Z" fill="url(#pg)"/><polyline class="pl" points="'+pts.join(" ")+'"/>';
 v.forEach(function(x,i){
  s+='<circle class="pd" cx="'+X(i).toFixed(1)+'" cy="'+Y(x).toFixed(1)+'" r="4"/>';
  if(v.length<=8||i===0||i===v.length-1||i===mx)s+='<text class="pv" x="'+X(i).toFixed(1)+'" y="'+(Y(x)-9).toFixed(1)+'" text-anchor="middle">'+nf(x)+'</text>'});
 s+='<text x="'+L+'" y="'+(H-6)+'">'+lt(ds[0],{day:"numeric",month:"short"})+'</text>';
 if(ds.length>1)s+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+lt(ds[ds.length-1],{day:"numeric",month:"short"})+'</text>';
 return s+'</svg>'}
function progView(){
 var names=exNames(),h='<h1>Progreso</h1>';
 if(!names.length)return h+'<div class="card" style="margin-top:12px"><p style="margin:0 0 6px"><b>Todavía no hay datos</b></p><p class="mute" style="margin:0">Cuando termines un día de entrenamiento, acá vas a ver cómo evoluciona el peso, las reps y las series de cada ejercicio.</p></div>';
 if(!pr.ex||names.indexOf(pr.ex)<0)pr.ex=names[0];
 h+='<p class="mute" style="margin:2px 0 12px">Evolución de cada ejercicio sesión a sesión.</p><label>Ejercicio</label><select style="margin-bottom:12px" onchange="pr.ex=this.value;render()">'+names.map(function(n){return'<option value="'+esc(n)+'"'+(n===pr.ex?" selected":"")+'>'+esc(n)+'</option>'}).join("")+'</select>';
 h+='<div class="seg">'+[["peso","Peso"],["reps","Reps"],["series","Series"],["vol","Volumen"]].map(function(x){return'<button class="'+(pr.m===x[0]?"sel":"")+'" onclick="pr.m=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join("")+'</div>';
 var ss=sess(pr.ex),m=pr.m,v=ss.map(function(s){return pv(s,m)}),u=MU[m][1],last=v[v.length-1],d=v.length>1?last-v[0]:null;
 h+='<div class="tiles"><div><b>'+nf(last)+'</b><span>Última'+(u?" ("+u+")":"")+'</span></div><div><b>'+nf(Math.max.apply(null,v))+'</b><span>Mejor'+(u?" ("+u+")":"")+'</span></div><div><b class="'+(d>0?"up":d<0?"dn":"")+'">'+(d===null?"—":(d>0?"+":"")+nf(d))+'</b><span>Cambio total</span></div></div>';
 h+='<div class="card"><div class="mute" style="font-size:13px;margin-bottom:4px">'+MU[m][0]+(u?" ("+u+")":"")+' · '+ss.length+(ss.length===1?" sesión":" sesiones")+'</div>'+chart(v,ss.map(function(s){return s.date}))+'</div>';
 h+='<div class="card"><b>Sesiones</b><div class="mute" style="font-size:12px;margin-bottom:2px">Cada serie como repeticiones × kg</div>';
 for(var i=ss.length-1;i>=0;i--){var s=ss[i],prev=i>0?pv(ss[i-1],m):null,df=prev===null?null:pv(s,m)-prev;
  h+='<div class="prow"><div style="min-width:0"><b class="cap">'+lt(s.date,{weekday:"short",day:"numeric",month:"short"})+'</b><div class="mute" style="font-size:13px">'+s.e.map(function(l){return l.r+(l.kg?"×"+l.kg:"")}).join(" · ")+'</div></div><div style="text-align:right;flex:none"><b>'+nf(pv(s,m))+(u?" "+u:"")+'</b>'+(df!==null&&Math.abs(df)>=.05?'<div class="'+(df>0?"up":"dn")+'" style="font-size:12px">'+(df>0?"▲ +":"▼ ")+nf(df)+'</div>':'')+'</div></div>'}
 return h+'</div>'}

function editor(){
 var h='<h1>Rutinas</h1><p class="mute">Cargá acá tus días de entrenamiento con sus ejercicios. Después los asignás a las fechas desde el Calendario. Los ejercicios que van en el mismo bloque se hacen en ronda: comparten la cantidad de series, y cada uno tiene sus propias reps, kilos y descanso.</p>';
 S.tpls.forEach(function(d){
  h+='<div class="card"><label>Nombre del día</label><input value="'+esc(d.name)+'" onchange="setTpl(\''+d.id+'\',this.value)">';
  grp(d).forEach(function(g){
   var blk=g.length>1,id=d.id;
   function row(e){
    var fs=blk?[["reps","Reps"],["kg","Kg"],["rest","Desc. (s)"]]:[["sets","Series"],["reps","Reps"],["kg","Kg"],["rest","Desc. (s)"]];
    return'<div class="exr"><div class="row"><input value="'+esc(e.name)+'" aria-label="Ejercicio" onchange="setEx(\''+id+'\',\''+e.id+'\',\'name\',this.value)"><button class="sm del" onclick="delEx(\''+id+'\',\''+e.id+'\')">Quitar</button></div><div class="grid g'+fs.length+'">'
     +fs.map(function(f){return'<div><label>'+f[1]+'</label><input type="number" inputmode="decimal" min="0" value="'+e[f[0]]+'" onchange="setEx(\''+id+'\',\''+e.id+'\',\''+f[0]+'\',this.value)"></div>'}).join("")
     +'</div><label>Bloque</label><select onchange="setBlock(\''+id+'\',\''+e.id+'\',this.value)"><option value="">Sin bloque</option>'+["A","B","C","D","E","F"].map(function(L){return'<option value="'+L+'"'+(e.g===L?" selected":"")+'>Bloque '+L+'</option>'}).join("")+'</select></div>'}
   if(!blk){h+=row(g[0]);return}
   h+='<div class="blkbox"><div class="blkh"><span class="blk" style="margin:0">Bloque '+g[0].g+' · '+g.length+' ejercicios</span><div style="width:120px"><label>Series del bloque</label><input type="number" inputmode="numeric" min="1" value="'+g[0].sets+'" onchange="setBlockSets(\''+id+'\',\''+g[0].g+'\',this.value)"></div></div>'
    +g.map(row).join('<div class="lnk" aria-hidden="true">+</div>')
    +'<button class="sm" style="margin-top:10px" onclick="addToBlock(\''+id+'\',\''+g[0].g+'\')">+ Ejercicio en este bloque</button></div>'});
  h+='<div class="row" style="margin-top:10px"><button class="sm" onclick="addEx(\''+d.id+'\')">+ Ejercicio</button><button class="sm del" onclick="delTpl(\''+d.id+'\')">Eliminar día</button></div></div>'});
 h+='<button class="go pri" onclick="addTpl()">+ Día de entrenamiento</button>';
 h+='<div class="card" style="margin-top:18px"><b>Copia de seguridad</b><p class="mute" style="margin:4px 0 12px">Guardá tu rutina, calendario e historial en un archivo, o pasalos a otro teléfono.</p><div class="row" style="margin:0"><button style="flex:1" onclick="exp()">Exportar</button><button style="flex:1" onclick="document.getElementById(\'imp\').click()">Importar</button></div><input id="imp" type="file" accept="application/json,.json" style="display:none" onchange="imp(this)"><button class="sm" style="margin-top:10px" onclick="txt()">Ver o pegar datos como texto</button><div id="bkw" style="display:none;margin-top:10px"><textarea id="bk" rows="5" style="width:100%;font:12px monospace;border-radius:12px;border:1px solid var(--line);padding:10px;background:var(--bg);color:var(--ink)"></textarea><p class="mute" style="font-size:13px;margin:6px 0">Para copiar: tocá el texto, seleccioná todo y copiá. Para importar: pegá acá el texto y tocá el botón.</p><button class="sm pri" onclick="impTxt()">Importar este texto</button></div></div>';
 return h}
function exp(){try{var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="rutina-gym-"+dk()+".json";document.body.appendChild(a);a.click();a.remove()}catch(e){}}
function txt(){var b=document.getElementById("bkw"),o=b.style.display==="none";b.style.display=o?"block":"none";if(o)document.getElementById("bk").value=JSON.stringify(S)}
function doImp(d){ask("¿Importar estos datos? Reemplazan lo que tenés ahora en este dispositivo.",function(){S=d;S.session=null;save();load();render()})}
function impTxt(){try{var d=JSON.parse(document.getElementById("bk").value);if(!d||!d.tpls)throw 0;doImp(d)}catch(e){ask("El texto no es una copia válida de la app.",function(){})}}
function imp(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!d.tpls)throw 0;ask("¿Importar este archivo? Reemplaza lo que tenés ahora en este teléfono.",function(){S=d;S.session=null;save();load();render()})}catch(e){ask("El archivo no es una copia válida de la app.",function(){})}};r.readAsText(f);inp.value=""}
function setBlock(tid,eid,v){var x=tpl(tid),i=x.ex.map(function(q){return q.id}).indexOf(eid),e=x.ex.splice(i,1)[0],at=-1;e.g=v;
 if(v)x.ex.forEach(function(q,j){if(q.g===v)at=j});x.ex.splice(at<0?i:at+1,0,e);var o=v&&x.ex.filter(function(q){return q!==e&&q.g===v})[0];if(o)e.sets=o.sets;save();render()}

function addToBlock(tid,L){var x=tpl(tid),at=-1,n=3;x.ex.forEach(function(q,j){if(q.g===L){at=j;n=q.sets}});x.ex.splice(at+1,0,{id:uid(),name:"Nuevo ejercicio",sets:n,reps:10,kg:0,rest:0,g:L});save();render()}

function delTpl(id){ask("¿Eliminar este día de entrenamiento? También se saca del calendario.",function(){delTpl2(id)})}
function delTpl2(id){
 S.tpls=S.tpls.filter(function(t){return t.id!==id});Object.keys(S.plan).forEach(function(k){if(S.plan[k]===id)delete S.plan[k]});

try{if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js")}catch(e){}
load();
if(S.session&&S.session.start&&Date.now()-S.session.start>1000*60*60*8){S.session=null;save()}
if(S.session&&!tpl(S.session.dayId)){S.session=null;save()}
render();
